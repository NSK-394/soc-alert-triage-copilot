services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-soc_triage}
    # Bound to loopback only -- a security audit flagged 0.0.0.0:5432 with a
    # guessable default password as a straightforward full-database-compromise
    # path on any non-strictly-local deployment. Still reachable from your own
    # machine via `psql -h localhost`; other containers reach it over the
    # compose network regardless of this mapping.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc} -d ${POSTGRES_DB:-soc_triage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass, set from REDIS_PASSWORD -- an unauthenticated Redis reachable
    # from the host let anyone push a raw job payload that RQ's worker would
    # pickle.loads() and execute (see services/tier2-worker/rq_worker.py). Also
    # bound to loopback only, same rationale as postgres above.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change_me_redis_password}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_redis_password}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest-api:
    build:
      context: .
      dockerfile: services/ingest-api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-soc}:${POSTGRES_PASSWORD:-soc_dev_password}@postgres:5432/${POSTGRES_DB:-soc_triage}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_redis_password}@redis:6379/0
    ports:
      - "${INGEST_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ./data:/app/data

  worker:
    build:
      context: .
      dockerfile: services/tier2-worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-soc}:${POSTGRES_PASSWORD:-soc_dev_password}@postgres:5432/${POSTGRES_DB:-soc_triage}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_redis_password}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ./data:/app/data

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-soc}:${POSTGRES_PASSWORD:-soc_dev_password}@postgres:5432/${POSTGRES_DB:-soc_triage}
      NEXT_PUBLIC_API_URL: http://localhost:${INGEST_API_PORT:-8000}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - ingest-api

volumes:
  postgres-data:
  redis-data:
